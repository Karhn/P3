<!DOCTYPE html>
<html lang="fr">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>OhMyFood - La palette du goût</title>
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css"
      integrity="sha512-MV7K8+y+gLIBoVD59lQIYicR65iaqukzvf/nwasF0nqhPay5w/9lJmVM2hMDcnK1OnMGCdVK+iQrJ7lzPJQd1w=="
      crossorigin="anonymous" referrerpolicy="no-referrer">
      <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Shrikhand&display=swap" rel="stylesheet">
   <link rel="stylesheet"  href="/assets/styles/style.css">
   <link rel="stylesheet"  href="/assets/styles/restaurant.css">
</head>

<body>
    <div class="main-container">
        <nav>
           <div class="header-nav">
               <a href="/index.html" class="back-button">
                  <i class="fa-solid fa-arrow-left"></i>
               </a>
               <div class="header-logo">
                 <img src="/assets/images/logo/ohmyfood.png" alt="Logo de la marque OhMyFood" class="logo">
               </div>
           </div>
        </nav>
        <main>
            <section class="hero-image">
               <img src="/assets/images/restaurants/jay-wennington-N_Y88TWmGwA-unsplash.jpg" alt="Restaurant La palette du goût" class="logo-restaurant">
            </section>
         
         <section class="menu-container">
            <header class="menu-header">
               <h1 class="title-menu"> La palette du goût </h1> 
               <div class="card-saving">
                  <input type="checkbox" id="heart-saving" class="heart-checkbox"/>
                  <label for="heart-saving" class="heart-label">
                     <i class="fa-regular fa-heart empty-heart"></i>
                     <i class="fa-solid fa-heart full-heart"></i>
                  </label>
               </div>
            </header>
            
            <section class="section-menu">
               <h2 class="section-menu-title"> ENTRÉES <hr> </h2>
   
               <article>
                  <label class="menu-item">
                     <input type="checkbox" class="toggle">
                     <div class="menu-text">
                        <h3> Fricassée d'escargots </h3>
                        <p> Au piment d'Espelette </p>
                     </div>
                     <div class="menu-price"> 25€ </div>
                     <div class="check-container">
                        <i class="fa-solid fa-circle-check icon-check"></i>
                     </div>
                  </label>
               </article>
   
               <article>
                  <label class="menu-item">
                     <input type="checkbox" class="toggle">
                     <div class="menu-text">
                        <h3> Foie gras de canard mi-cuit </h3>
                        <p> Et ses copaux de truffe noire </p>
                     </div>
                     <div class="menu-price"> 35€ </div>
                     <div class="check-container">
                        <i class="fa-solid fa-circle-check icon-check"></i>
                     </div>
                  </label>
               </article>
   
               <article>
                  <label class="menu-item">
                     <input type="checkbox" class="toggle">
                     <div class="menu-text">
                        <h3> Oeuf au plat </h3>
                        <p> Assaisonné à la truffe sur lit de caviar </p>
                     </div>
                     <div class="menu-price"> 20€ </div>
                     <div class="check-container">
                        <i class="fa-solid fa-circle-check icon-check"></i>
                     </div>
                  </label>
               </article>
            </section>

            <section class="section-menu">
               <h2 class="section-menu-title"> PLATS <hr> </h2>
   
               <article>
                  <label class="menu-item">
                     <input type="checkbox" class="toggle">
                     <div class="menu-text">
                        <h3> Filet de boeuf aux herbes </h3>
                        <p> Accompagné de sa ribambelle de légumes </p>
                     </div>
                     <div class="menu-price"> 40€ </div>
                     <div class="check-container">
                        <i class="fa-solid fa-circle-check icon-check"></i>
                     </div>
                  </label>
               </article>
   
               <article>
                  <label class="menu-item">
                     <input type="checkbox" class="toggle">
                     <div class="menu-text">
                        <h3> Parmentier de queue de boeuf </h3>
                        <p> À la truffe noire sur sa purée de panais </p>
                     </div>
                     <div class="menu-price"> 35€ </div>
                     <div class="check-container">
                        <i class="fa-solid fa-circle-check icon-check"></i>
                     </div>
                  </label>
               </article>
   
               <article>
                  <label class="menu-item">
                     <input type="checkbox" class="toggle">
                     <div class="menu-text">
                        <h3> Filet de turbot </h3>
                        <p> Aux agrumes </p>
                     </div>
                     <div class="menu-price"> 44€ </div>
                     <div class="check-container">
                        <i class="fa-solid fa-circle-check icon-check"></i>
                     </div>
                  </label>
               </article>
            </section>

            <section class="section-menu">
               <h2 class="section-menu-title"> DESSERTS <hr> </h2>

               <article>
                  <label class="menu-item">
                     <input type="checkbox" class="toggle">
                     <div class="menu-text">
                        <h3> Paris-Brest </h3>
                        <p> Revisité </p>
                     </div>
                     <div class="menu-price"> 18€ </div>
                     <div class="check-container">
                        <i class="fa-solid fa-circle-check icon-check"></i>
                     </div>
                  </label>
               </article>

               <article>
                  <label class="menu-item">
                     <input type="checkbox" class="toggle">
                     <div class="menu-text">
                        <h3> Macaron au chocolat d'exception </h3>
                        <p> Et glace à la vanille de Madagascar </p>
                     </div>
                     <div class="menu-price"> 22€ </div>
                     <div class="check-container">
                        <i class="fa-solid fa-circle-check icon-check"></i>
                     </div>
                  </label>
               </article>

               <article>
                  <label class="menu-item">
                     <input type="checkbox" class="toggle">
                     <div class="menu-text">
                        <h3> Mousse au chocolat </h3>
                        <p> Au piment d'Espelette et à la truffe noire </p>
                     </div>
                     <div class="menu-price"> 23€ </div>
                     <div class="check-container">
                        <i class="fa-solid fa-circle-check icon-check"></i>
                     </div>
                  </label>
               </article>
            </section>
            <section class="btn-container">
               <button class="btn"> Commander </button>
            </section>
         </section>

         </main>
         <footer class="footer">
         <div class="footer-container">
            <h3 class="footer-title">ohmyfood</h3>
            <div class="footer-links">
               <div class="footer-groupe">
                  <li> <i class="fa-solid fa-utensils icon-footer"></i> Proposer un restaurant </li>
                  <li> <i class="fa-solid fa-handshake-angle icon-footer"></i> Devenir partenaire </li>
                  <li class="footer-mention"> Mentions légales </li>
                  <li> <a href="mailto:ohmyfood@goodfood.fr"> Contact </a> </li> 
               </div>
            </div>
         </div>
      </footer>
    </div>
</body>
